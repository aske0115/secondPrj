<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Tumble Isle</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body data-mode="title">
  <div id="boot"></div>
  <div id="hud">
    <div class="pill" id="hearts"><div class="hpbar"><i id="hpLag"></i><b id="hpFill"></b></div><span id="hpText"></span></div>
    <div class="pill" id="time"></div>
    <button id="pause" aria-label="일시정지 / Pause"></button>
    <div id="xp"><b id="lvl"></b><div class="bar"><i></i></div></div>
    <div class="chip" id="falls"></div>
    <span id="dev"></span>
  </div>
  <div id="warn" hidden></div>
  <div id="hint" hidden></div>
  <div id="bossPct" hidden></div>
  <div id="toast"></div>
  <div id="stick"><i></i></div>
  <button id="sweep"><span></span></button>
  <div id="overlay" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
