<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>secondPrj</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="top">
    <button id="prev" class="icon" aria-label="prev">‹</button>
    <div id="title"><b id="stage-name"></b><span id="status"></span><button id="lang" class="link"></button><button id="help" class="link"></button></div>
    <button id="next" class="icon" aria-label="next">›</button>
  </header>
  <div id="tip" class="card" hidden></div>
  <main id="board-wrap"><div id="board"></div></main>
  <div id="hint"></div>
  <footer id="bar">
    <button id="undo" class="pill"></button>
    <button id="restart" class="pill"></button>
    <button id="end" class="pill gold"></button>
  </footer>
  <div id="result" class="sheet" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
